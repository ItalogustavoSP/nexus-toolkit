[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-toolkit"
version = "0.1.0"
description = "Kit de ferramentas para diagnóstico, monitoramento e manutenção segura do Windows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0",
"ruff>=0.11",
"mypy>=1.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src"]
warn_unused_configs = true
check_untyped_defs = true
